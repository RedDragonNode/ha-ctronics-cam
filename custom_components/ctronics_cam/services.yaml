ptz_move:
  target:
    entity:
      integration: ctronics_cam
      domain: camera
  fields:
    direction:
      required: true
      example: left
      selector:
        select:
          translation_key: ptz_direction
          options:
            - up
            - down
            - left
            - right
    speed:
      selector:
        number:
          min: 1
          max: 8
          mode: slider
    duration:
      selector:
        number:
          min: 0.05
          max: 5
          step: 0.05
          unit_of_measurement: s
          mode: box

ptz_goto_preset:
  target:
    entity:
      integration: ctronics_cam
      domain: camera
  fields:
    preset:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 64
          mode: box

ptz_save_preset:
